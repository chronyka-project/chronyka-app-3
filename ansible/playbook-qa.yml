---
- name: Deploy Todo App and Run Automated Tests on QA Environment
  hosts: all
  become: yes # Permissão de root para instalação e gerenciamento de serviços

  tasks:
    - name: Gathering Facts
      ansible.builtin.setup:

    - name: Configure apt to prefer IPv4
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/99force-ipv4
        create: yes
        line: 'Acquire::ForceIPv4 "true";'
        state: present
      when: ansible_os_family == "Debian" # Aplica apenas em VMs Debian/Ubuntu

    - name: Update apt cache # <--- NOVO: FORÇA A ATUALIZAÇÃO DO CACHE
      ansible.builtin.apt:
        update_cache: yes
        # Se for um ambiente Debian/Ubuntu, use esta condição
      when: ansible_os_family == "Debian"

    - name: Ensure Python, UFW, and DNS Utilities are installed
      ansible.builtin.package:
        name: 
          - python3
          - python3-pip # Necessário para instalar dependências de teste
          - ufw
          - dnsutils
        state: present

    - name: Configure UFW to allow SSH (port 22) and app access (5000 / 9090 / 9100)
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
        state: enabled
      loop:
        - '22'
        - '5000'
        - '9090'

    # --- 1. INSTALAÇÃO DO DOCKER ENGINE (Sem alterações) ---
    - name: Install required packages for Docker
      ansible.builtin.package:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG apt key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker repository to Apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker CLI
      ansible.builtin.package:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
        
    # --- 2. INSTALAÇÃO DO DOCKER COMPOSE (Sem alterações) ---
    - name: Install Docker Compose
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        timeout: 30
        
    # --- 3. CONFIGURAR PERMISSÕES E RECONECTAR (Sem alterações) ---
    - name: Add 'dev' user to the docker group
      ansible.builtin.user:
        name: dev
        groups: docker
        append: yes
      
    - name: Reset SSH connection to apply new group membership
      ansible.builtin.meta: reset_connection

    - name: Wait 10 seconds for user group changes to take effect
      ansible.builtin.pause:
        seconds: 10

    # --- 4. DEPLOY DA APLICAÇÃO TODO APP (Caminhos atualizados) ---
    - name: Create application directory for Todo App
      ansible.builtin.file:
        path: /home/dev/app/todo-app # Caminho atualizado
        state: directory
        owner: dev
        group: dev
        mode: '0755'
        
    - name: Copy Todo App files (including Dockerfiles and compose)
      ansible.builtin.copy:
        # ATENÇÃO: Ajuste este caminho 'src' para o local onde os seus arquivos de deploy estão no host
        src: ../files/ 
        dest: /home/dev/app/todo-app # Caminho atualizado
        owner: dev
        group: dev
        mode: '0755'

    - name: Run Docker Compose up to start the services
      ansible.builtin.command: /usr/local/bin/docker-compose up -d --build
      args:
        chdir: /home/dev/app/todo-app # Caminho atualizado
      become: yes
      become_user: dev
      environment:
        DOCKER_HOST: unix:///var/run/docker.sock
        DOCKER_API_VERSION: "1.44"

    # --- 5. EXECUÇÃO DOS TESTES AUTOMATIZADOS (Porta de espera atualizada) ---
    - name: Create directory for test scripts
      ansible.builtin.file:
        path: /home/dev/app/qa-tests
        state: directory
        owner: dev
        group: dev
        mode: '0755'

    - name: Copy test scripts and requirements.txt (e.g., pytest, selenium)
      ansible.builtin.copy:
        # ATENÇÃO: Ajuste este caminho 'src' para o local onde os seus arquivos de teste estão no host
        src: ../files/qa-tests/ 
        dest: /home/dev/app/qa-tests
        owner: dev
        group: dev
        mode: '0755'

    - name: Install Python test dependencies
      ansible.builtin.pip:
        requirements: /home/dev/app/qa-tests/requirements.txt
        executable: pip3
      become: yes
      become_user: dev

    - name: Wait for Frontend (Nginx) to be fully ready before running tests
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5000 
        timeout: 60
        state: started

    - name: Run Automated Tests
      ansible.builtin.command: python3 -m pytest # Ou o comando específico da sua suíte de testes
      args:
        chdir: /home/dev/app/qa-tests
      become: yes
      become_user: dev
      register: test_results

    - name: Display Test Results
      ansible.builtin.debug:
        var: test_results.stdout_lines
        
    - name: Fail the Ansible playbook if tests failed
      ansible.builtin.fail:
        msg: "Automated tests failed. Check the results above."
      when: test_results.rc != 0