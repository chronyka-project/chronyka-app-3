- name: Deploy and Configure Flask ToDo App with Gunicorn and Systemd
  hosts: sua_vm_ip_ou_nome # Substitua pelo IP da VM ou pelo nome do grupo no seu inventário
  become: yes # Executa tarefas com privilégios de root (necessário para apt e systemd)

  vars:
    app_dir: "/home/{{ ansible_user }}/todo_app"
    service_name: "todo_app"

  tasks:
    - name: 1. Instalar dependências essenciais (Python, venv, ufw)
      ansible.builtin.apt:
        name: 
          - python3
          - python3-venv
          - python3-pip
          - ufw 
        state: present
        update_cache: yes

    - name: 2. Criar diretório do projeto e garantir permissões
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: 3. Copiar o arquivo principal do aplicativo (app.py)
      # Nota: Certifique-se de que o app.py completo (com as rotas /itens) 
      # está na mesma pasta onde você executa o playbook.
      ansible.builtin.copy:
        src: ./app.py 
        dest: "{{ app_dir }}/app.py"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: 4. Configurar Ambiente Virtual (venv)
      ansible.builtin.command: python3 -m venv {{ app_dir }}/venv
      args:
        creates: "{{ app_dir }}/venv/bin/activate" # Evita re-execução

    - name: 5. Instalar Python dependências no venv (Flask, Gunicorn, CORS)
      ansible.builtin.pip:
        name: 
          - Flask
          - gunicorn
          - flask-cors
        virtualenv: "{{ app_dir }}/venv"

    - name: 6. Copiar e Configurar Template do Serviço Systemd
      ansible.builtin.template:
        src: todo_app.service.j2 # Usando o template que criamos
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: '0644'
      notify: 
        - Reload Systemd

    - name: 7. Abrir porta 5000 no firewall (UFW)
      community.general.ufw:
        rule: allow
        port: 5000
        proto: tcp
        state: enabled

    - name: 8. Habilitar e iniciar o serviço Gunicorn
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: started
        daemon_reload: yes # Garante que o systemd carregue o novo arquivo de serviço

  handlers:
    - name: Reload Systemd
      ansible.builtin.systemd:
        daemon_reload: yes