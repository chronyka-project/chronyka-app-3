---
- name: Setup ToDo Flask Application
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    app_user: "todo_app_user"
    app_dir: "/opt/todo_app"
    python_version: "python3"
    venv_name: "venv"
    gunicorn_entry_point: "app:app"
    app_port: '5000' 

  tasks:
    - name: Install System Dependencies
      ansible.builtin.apt:
        name: 
          - "{{ python_version }}"
          - "{{ python_version }}-venv"
          - "python3-pip"
          - "build-essential"
          - "ufw"
        state: present
        update_cache: yes

    # 1. Criação de Usuário e Diretório
    - name: Create dedicated user and directory
      ansible.builtin.user:
        name: "{{ app_user }}"
        state: present
        system: yes
      
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
    
      # Tarefa CORRIGIDA: Copiar os arquivos do backend para a pasta de destino na VM.
      # O caminho de origem (src) foi corrigido de '../files/' para 'files/backend/'.
    - name: Copy Application Backend Files (app.py and requirements.txt)
      ansible.builtin.copy:
       # Corrigido: Usamos 'files/backend/' para pegar app.py e outros arquivos.
       src: files/backend/ 
       dest: "{{ app_dir }}"
       owner: "{{ app_user }}"
       group: "{{ app_user }}"
       mode: '0755'

    # Se você também precisar do requirements.txt que está na raiz de 'files/', use a tarefa abaixo:
    # - name: Copy root requirements.txt (if necessary)
    #   ansible.builtin.copy:
    #    src: files/requirements.txt
    #    dest: "{{ app_dir }}/requirements.txt"
    #    owner: "{{ app_user }}"
    #    group: "{{ app_user }}"
    #    mode: '0644'
    # NOTA: Se o requirements.txt estiver dentro de 'files/backend/' junto com o 'app.py', a tarefa acima já resolve.

    - name: Create Python Virtual Environment
      ansible.builtin.command: "{{ python_version }} -m venv {{ venv_name }}"
      args:
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/{{ venv_name }}"

    - name: Install Python dependencies (Flask/Gunicorn/Exporter)
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/{{ venv_name }}"

    # 3. Configuração do Systemd
    - name: Set up Systemd Service File using Template
      ansible.builtin.template:
        # A fonte (src) é o arquivo .j2 dentro da pasta 'ansible/'
        # O caminho relativo 'todo_app.service.j2' geralmente funciona bem aqui.
        src: todo_app.service.j2 
        dest: /etc/systemd/system/todo_app.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Restart Flask Service
      
    - name: Allow incoming traffic on application port ({{ app_port }})
      ansible.builtin.ufw:
        rule: allow
        port: '{{ app_port }}'
        proto: tcp
        state: enabled

  handlers:
    - name: Restart Flask Service
      ansible.builtin.systemd:
        name: todo_app
        state: restarted
        daemon_reload: yes
        enabled: yes