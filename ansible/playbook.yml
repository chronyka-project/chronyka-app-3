---
- name: Setup ToDo Flask Application
  hosts: aplicacao_vms
  gather_facts: yes
  become: yes

  vars:
    app_user: "todo_app_user"
    app_dir: "/opt/todo_app"
    python_version: "python3"
    venv_name: "venv"
    # CORREÇÃO CRÍTICA: Agora que app.py está na raiz do deploy, voltamos ao padrão 'app:app'
    gunicorn_entry_point: "app:app" 
    app_port: '5000' 

  tasks:
    - name: Install System Dependencies
      ansible.builtin.apt:
        name: 
          - "{{ python_version }}"
          - "{{ python_version }}-venv"
          - "python3-pip"
          - "build-essential"
          - "ufw"
        state: present
        update_cache: yes

    # 1. Criação de Usuário e Diretório
    - name: Create dedicated user and directory
      ansible.builtin.user:
        name: "{{ app_user }}"
        state: present
        system: yes
      
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
    
    # 2. TAREFA DE CÓPIA: Copia o conteúdo da pasta 'files/' (raiz) para '{{ app_dir }}'.
    # Isso copia app.py e requirements.txt.
    - name: Copy Application Files (Code and Requirements)
      ansible.builtin.copy:
        # Caminho corrigido: Sai de 'ansible/', vai para a raiz do repo, e entra em 'files/'
        src: ../files/
        dest: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755' 

    - name: Create Python Virtual Environment
      ansible.builtin.command: "{{ python_version }} -m venv {{ venv_name }}"
      args:
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/{{ venv_name }}"

    - name: Install Python dependencies (Flask/Gunicorn/Exporter)
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/{{ venv_name }}"

    # 3. Configuração do Systemd
    - name: Set up Systemd Service File using Template
      ansible.builtin.template:
        src: todo_app.service.j2 
        dest: /etc/systemd/system/todo_app.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Restart Flask Service
      
    - name: Allow incoming traffic on application port ({{ app_port }})
      ansible.builtin.ufw:
        rule: allow
        port: '{{ app_port }}'
        proto: tcp
        state: enabled
      
  handlers:
    - name: Restart Flask Service
      ansible.builtin.systemd_service:
        name: todo_app
        state: restarted
        daemon_reload: yes

- name: ⚙️ Atualizar Configuração do Prometheus
  hosts: localhost 
  gather_facts: no
  vars:
    # Use 5000, a porta da sua aplicação (exporter)
    app_exporter_port: 5000 
    prometheus_sd_path: /etc/prometheus/file_sd/targets.json 

  tasks:
    - name: 1. Gerar o arquivo targets.json com IPs dinâmicos
      ansible.builtin.template:
        src: templates/prometheus_targets.j2
        dest: /tmp/targets.json
        # OBS: Se você tiver usado a variável 'node_exporter_port' no template anterior,
        # substitua por 'app_exporter_port' ou apenas use '5000' fixo no .j2.
      run_once: true

    - name: 2. Copiar targets.json para o servidor Prometheus
      ansible.builtin.copy:
        src: /tmp/targets.json
        dest: "{{ prometheus_sd_path }}"
      delegate_to: prometheus_vm 
      become: yes
      run_once: true

    - name: 3. Recarregar configuração do Prometheus
      ansible.builtin.uri:
        url: "http://127.0.0.1:9090/-/reload"
        method: POST
      delegate_to: prometheus_vm
      run_once: true
      ignore_errors: yes