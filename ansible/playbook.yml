---
- name: Deploy Todo Application (Flask API + Nginx Frontend) with Docker Compose
  hosts: all
  become: yes # Permissão de root para instalação e gerenciamento de serviços

  tasks:
    - name: Gathering Facts
      ansible.builtin.setup:

    - name: Ensure Python and UFW are installed
      ansible.builtin.package:
        name: 
          - python3
          - ufw
          - dnsutils
        state: present

    - name: Configure UFW to allow SSH (port 22)
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
        state: enabled
        
    - name: Configure UFW to allow access to Frontend Nginx (port 5000)
      community.general.ufw:
        rule: allow
        port: '5000'
        proto: tcp
        state: enabled

    # --- 1. INSTALAÇÃO DO DOCKER ENGINE (Sem alterações) ---
    - name: Install required packages for Docker
      ansible.builtin.package:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG apt key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker repository to Apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker CLI
      ansible.builtin.package:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
        
    # --- 2. INSTALAÇÃO DO DOCKER COMPOSE (Sem alterações) ---
    - name: Install Docker Compose
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        timeout: 30
        
    # --- 3. CONFIGURAR PERMISSÕES E RECONECTAR (Sem alterações) ---
    - name: Add 'dev' user to the docker group
      ansible.builtin.user:
        name: dev
        groups: docker
        append: yes
      
    - name: Reset SSH connection to apply new group membership
      ansible.builtin.meta: reset_connection

    - name: Wait 10 seconds for user group changes to take effect
      ansible.builtin.pause:
        seconds: 10

    # --- 4. DEPLOY DA APLICAÇÃO TODO APP (Alterações aqui) ---
    - name: Create application directory for Todo App
      ansible.builtin.file:
        # Diretório alterado para refletir o nome da aplicação
        path: /home/dev/app/todo-app 
        state: directory
        owner: dev
        group: dev
        mode: '0755'
        
    - name: Copy Todo App files (including Dockerfiles and compose)
      ansible.builtin.copy:
        # Assume que todos os arquivos (Dockerfiles, compose, app.py, index.html, etc.) estão em ../files/
        src: ../files/ 
        # Destino alterado
        dest: /home/dev/app/todo-app 
        owner: dev
        group: dev
        mode: '0755'

    # --- TAREFAS DE DEBUG ---
    - name: DEBUG - List files in deployment directory (as 'dev' user)
      ansible.builtin.command: ls -la /home/dev/app/todo-app
      args:
        chdir: /home/dev/app/todo-app
      become: yes
      become_user: dev
      register: deploy_dir_contents
      changed_when: false

    - name: DEBUG - Print deployment directory contents
      ansible.builtin.debug:
        var: deploy_dir_contents.stdout_lines

    - name: Run Docker Compose up (Build and Start services)
      ansible.builtin.command: /usr/local/bin/docker-compose up -d --build
      args:
        # Diretório de execução alterado
        chdir: /home/dev/app/todo-app 
      become: yes
      become_user: dev
      environment:
        DOCKER_HOST: unix:///var/run/docker.sock
        DOCKER_API_VERSION: "1.44"