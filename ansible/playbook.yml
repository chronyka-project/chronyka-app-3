---
- name: Setup ToDo Flask Application
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    app_user: "todo_app_user"
    app_dir: "/opt/todo_app"
    python_version: "python3"
    venv_name: "venv"
    gunicorn_entry_point: "app:app"
    # Nova variável para a porta da aplicação (onde o exporter também roda por padrão)
    app_port: '5000' 

  tasks:
    - name: Install System Dependencies
      ansible.builtin.apt:
        name: 
          - "{{ python_version }}"
          - "{{ python_version }}-venv"
          - "python3-pip"
          - "build-essential"
        state: present
        update_cache: yes

    # 1. Criação de Usuário e Diretório
    - name: Create dedicated user and directory
      ansible.builtin.user:
        name: "{{ app_user }}"
        state: present
        system: yes
      
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
    
      # Tarefa: copiar todo o conteúdo da pasta 'files/' (que está na raiz do repo) 
      # Deve conter o requirements.txt ATUALIZADO com 'prometheus-flask-exporter'.
    - name: Copy Application Files (Code and Requirements)
      ansible.builtin.copy:
       src: ../files/
       dest: "{{ app_dir }}"
       owner: "{{ app_user }}"
       group: "{{ app_user }}"
       # Use 0755 para o diretório se você estiver copiando a pasta inteira
       mode: '0755'

    - name: Create Python Virtual Environment
      ansible.builtin.command: "{{ python_version }} -m venv {{ venv_name }}"
      args:
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/{{ venv_name }}"

    - name: Install Python dependencies (Flask/Gunicorn/Exporter)
      # Esta tarefa instalará o prometheus-flask-exporter se ele estiver no requirements.txt
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/{{ venv_name }}"

    # 3. Configuração do Systemd
    - name: Set up Systemd Service File using Template
      ansible.builtin.template:
        # A fonte (src) é o arquivo .j2 dentro da pasta 'ansible/'
        src: todo_app.service.j2 
        # O destino (dest) é onde o Systemd espera encontrar o arquivo
        dest: /etc/systemd/system/todo_app.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Restart Flask Service
      
    - name: Install UFW package
      ansible.builtin.apt:
       name: ufw
       state: present
       update_cache: yes
    
    # Abrindo a porta principal da aplicação (Node Exporter roda aqui)
    - name: Allow incoming traffic on application port ({{ app_port }})
      ansible.builtin.ufw:
        rule: allow
        port: '{{ app_port }}'
        proto: tcp
        state: enabled

  handlers:
    - name: Restart Flask Service
      ansible.builtin.systemd:
        name: todo_app
        state: restarted
        daemon_reload: yes
        enabled: yes