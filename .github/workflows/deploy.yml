name: Deploy App-3 To-Do

on:
  push:
    branches:
      # - dev
      # - qa
      - prod
      
  # Seleção do ambiente em caso de trigger manual
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Selecione o ambiente para deploy manual (dev, qa, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
          - grafana

      action_type: # NOVO INPUT
        description: 'Selecione a Ação Manual (Deploy ou Destroy)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

  repository_dispatch:
    types: [run-autoscaling-todo]

# Variáveis de Ambiente GLOBAIS
# Estas variáveis estarão disponíveis em TODOS os jobs (terraform-* e destroy-*)
env:
  TF_VAR_vsphere_server: ${{ secrets.VSPHERE_SERVER }}
  TF_VAR_vsphere_user: ${{ secrets.VSPHERE_USER }}
  TF_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: true

jobs:
  terraform-dev:
    # Roda apenas em push para a branch 'dev'
    if: |
      (github.ref == 'refs/heads/dev' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev' && github.event.inputs.action_type == 'deploy') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'run-autoscaling-todo')
    runs-on: self-hosted
    outputs:
      new_vm_ip: ${{ steps.get-ip.outputs.new_vm_ip }}
    environment:
      name: DEV

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init
        id: init
        run: /usr/local/bin/terraform init
        working-directory: ./terraform/dev

      - name: Terraform Plan
        id: plan
        run: /usr/local/bin/terraform plan -input=false -out=tfplan
        working-directory: ./terraform/dev
        continue-on-error: true
        
      - name: Terraform Apply
        if: steps.plan.outcome == 'success'
        run: /usr/local/bin/terraform apply -auto-approve tfplan
        working-directory: ./terraform/dev

      - name: Get VM IP and Set as Output
        id: get-ip
        run: echo "new_vm_ip=$(/usr/local/bin/terraform output -raw new_vm_ip)" >> $GITHUB_OUTPUT
        working-directory: ./terraform/dev
        
      # - name: Wait for VM to boot and SSH to be ready
      #  run: sleep 150 
  
  configure-vm-dev:
    runs-on: self-hosted
    needs: [terraform-dev]
    if: always() && needs.terraform-dev.result == 'success'
    outputs:
      new_vm_ip: ${{ needs.terraform-dev.outputs.new_vm_ip }}
    environment:
      name: DEV
      url: http://${{ needs.terraform-dev.outputs.new_vm_ip }}:5000
      
    # Variáveis de Conexão do Ansible movidas para o nível do JOB
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
      ANSIBLE_CONNECTION: "ssh"
      ANSIBLE_CONNECT_TIMEOUT: "30"
      ANSIBLE_TIMEOUT: "60"
      ANSIBLE_BECOME: "true"

    steps:
      - name: Checkout Repository (Para o Playbook Ansible e arquivos)
        uses: actions/checkout@v4

      - name: Remove chave SSH antiga do host (Corrige Host Key Changed)
        run: |
          VM_IP="${{ needs.terraform-dev.outputs.new_vm_ip }}"
          # O '|| true' garante que o pipeline não falhe se a chave não existir
          ssh-keygen -f /home/dev/.ssh/known_hosts -R "$VM_IP" || true
      
      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
          # Adicione a chave ao ssh-agent (melhor prática)
          eval "$(ssh-agent -s)"
          ssh-add /tmp/ansible_key
      
      - name: DEBUG - List files expected by Ansible
        run: |
          echo "Current directory is: $(pwd)"
          echo "Listing content of: files/"
          ls -la files/
          echo "Listing content of: ansible/"
          ls -la ansible/
        continue-on-error: true # Não deixe que isso falhe o job    
      
      - name: Run Ansible Playbook to Setup Flask
        # Usando as variáveis globais do Ansible definidas no 'env' do job
        run: ansible-playbook -i ${{ needs.terraform-dev.outputs.new_vm_ip }}, ansible/playbook.yml --user ${{ env.ANSIBLE_USER }} --private-key /tmp/ansible_key -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
  
  update-haproxy-config-dev:
    runs-on: self-hosted
    needs: [configure-vm-dev]
    if: always() && needs.configure-vm-dev.result == 'success'
    environment:
      name: DEV

    env:
      # Use um Secret para o IP do seu Load Balancer HAProxy
      HAPROXY_HOST: ${{ secrets.HAPROXY_SERVER_IP }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev" # Usuário com acesso ao HAProxy
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update HAProxy Config
        # Use o pipe para iniciar o bloco de comando multi-linha
        run: | 
          ansible-playbook -i $HAPROXY_HOST, ansible/haproxy/haproxy_config.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-dev.outputs.new_vm_ip }}" \
            -e "backend_name=app_servers_todo_dev" \
            -e "app_port=5000"

# --- NOVO JOB: Atualizar o Prometheus Targets para o ambiente DEV ---
  update-prometheus-targets-dev:
    runs-on: self-hosted
    # Este job só deve rodar após o deploy e configuração da nova VM DEV
    needs: [configure-vm-dev] 
    if: always() && needs.configure-vm-dev.result == 'success'
    environment:
      name: DEV

    env:
      # Use uma variável de ambiente ou secret para o IP do seu servidor Prometheus
      PROMETHEUS_HOST: ${{ secrets.PROMETHEUS_SERVER_IP }}
      ANSIBLE_USER: "dev" # Ex: ansible_user ou um usuário dedicado
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          # Reutiliza a chave SSH. Se o usuário for diferente, pode ser necessária outra chave.
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update Prometheus Targets
        # Executa um playbook específico no HOST do Prometheus, passando o IP da nova VM
        run: | 
          ansible-playbook -i $PROMETHEUS_HOST, ansible/prometheus/prometheus_targets.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-dev.outputs.new_vm_ip }}" \
            -e "environment_name=dev" \
            -e "app_name=todo"
        
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
  
  update-grafana-dashboard-dev:
    runs-on: self-hosted
    # Depende da atualização do Prometheus
    needs: [configure-vm-dev, update-prometheus-targets-dev] 
    if: always() && needs.update-prometheus-targets-dev.result == 'success'
    environment:
      name: DEV
      
    env:
      # Use o IP da VM de Monitoramento (Grafana/Prometheus)
      GRAFANA_HOST: ${{ secrets.MONITORING_VM_IP }} 
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init (Grafana)
        run: terraform init
        working-directory: ./terraform/grafana/dev

      - name: Terraform Apply (Grafana Dashboard)
        run: | 
          terraform apply -auto-approve \
            -var "grafana_url=http://${{ env.GRAFANA_HOST }}:3000" \
            -var "grafana_api_key=${{ env.GRAFANA_API_KEY }}" \
            -var "environment=dev"
        working-directory: ./terraform/grafana/dev

#####################################################################
# JOB PARA PROVISIONAMENTO E CONFIGURAÇÃO DE QA
#####################################################################
  terraform-qa:
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'qa' && github.event.inputs.action_type == 'deploy')
    
    runs-on: self-hosted
    environment:
      name: QA
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init (QA)
        run: /usr/local/bin/terraform init
        working-directory: ./terraform/qa

      - name: Terraform Apply (QA)
        run: /usr/local/bin/terraform apply -auto-approve
        working-directory: ./terraform/qa

      - name: Get VM IP and Set as Output (QA)
        id: get-ip-qa
        run: echo "new_vm_ip_qa=$(/usr/local/bin/terraform output -raw new_vm_ip)" >> $GITHUB_OUTPUT
        working-directory: ./terraform/qa
        
      # - name: Wait for VM to boot and SSH to be ready
      #  run: sleep 120

    outputs:
      new_vm_ip_qa: ${{ steps.get-ip-qa.outputs.new_vm_ip_qa }}
      
  configure-vm-qa:
    runs-on: self-hosted
    needs: [terraform-qa] # Depende do provisionamento do QA
    if: always() && needs.terraform-qa.result == 'success'
    outputs:
      new_vm_ip_qa: ${{ needs.terraform-qa.outputs.new_vm_ip_qa}}
    environment:
      name: QA
      url: http://${{ needs.terraform-qa.outputs.new_vm_ip_qa }}:5000
    
    # Variáveis de Conexão do Ansible movidas para o nível do JOB
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev" # Assumindo que o usuário SSH para QA também é 'dev'
      ANSIBLE_CONNECTION: "ssh"
      ANSIBLE_CONNECT_TIMEOUT: "30"
      ANSIBLE_TIMEOUT: "60"
      ANSIBLE_BECOME: "true"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
            
      - name: Remove chave SSH antiga do host (Corrige Host Key Changed)
        run: |
          VM_IP="${{ needs.terraform-qa.outputs.new_vm_ip_qa }}"
          # O '|| true' garante que o pipeline não falhe se a chave não existir
          ssh-keygen -f /home/dev/.ssh/known_hosts -R "$VM_IP" || true

      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
          
      - name: Run Ansible Playbook to Setup Flask (QA)
        run: ansible-playbook -i ${{ needs.terraform-qa.outputs.new_vm_ip_qa }}, ansible/playbook-qa.yml --user ${{ env.ANSIBLE_USER }} --private-key /tmp/ansible_key

  update-haproxy-config-qa:
    runs-on: self-hosted
    needs: [configure-vm-qa]
    if: always() && needs.configure-vm-qa.result == 'success'
    environment:
      name: QA

    env:
      # Use um Secret para o IP do seu Load Balancer HAProxy
      HAPROXY_HOST: ${{ secrets.HAPROXY_SERVER_IP }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update HAProxy Config
        # Use o pipe para iniciar o bloco de comando multi-linha
        run: | 
          ansible-playbook -i $HAPROXY_HOST, ansible/haproxy/haproxy_config.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-qa.outputs.new_vm_ip_qa }}" \
            -e "backend_name=app_servers_todo_qa" \
            -e "app_port=5000"

# --- NOVO JOB: Atualizar o Prometheus Targets para o ambiente QA ---
  update-prometheus-targets-qa:
    runs-on: self-hosted
    # Este job só deve rodar após o deploy e configuração da nova VM DEV
    needs: [configure-vm-qa] 
    if: always() && needs.configure-vm-qa.result == 'success'
    environment:
      name: QA

    env:
      # Use uma variável de ambiente ou secret para o IP do seu servidor Prometheus
      PROMETHEUS_HOST: ${{ secrets.PROMETHEUS_SERVER_IP }}
      ANSIBLE_USER: "dev" # Ex: ansible_user ou um usuário dedicado
      
    steps:
      - name: Checkout Repository
