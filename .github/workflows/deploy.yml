name: App-3 To-Do

on:
  push:
    branches:
      - dev
      - qa
      - prod
      
  # Seleção do ambiente em caso de trigger manual
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Selecione o ambiente para deploy manual (dev, qa, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
          - grafana

      action_type:
        description: 'Selecione a Ação Manual (Deploy ou Destroy)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

# Variáveis de Ambiente GLOBAIS
env:
  TF_VAR_vsphere_server: ${{ secrets.VSPHERE_SERVER }}
  TF_VAR_vsphere_user: ${{ secrets.VSPHERE_USER }}
  TF_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: true

jobs:
  terraform-dev:
    if: |
      (github.ref == 'refs/heads/dev' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev' && github.event.inputs.action_type == 'deploy')
    runs-on: self-hosted
    outputs:
      new_vm_ip: ${{ steps.get-ip.outputs.new_vm_ip }}
    environment:
      name: DEV

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init
        id: init
        run: /usr/local/bin/terraform init
        working-directory: ./terraform/dev

      - name: Terraform Plan
        id: plan
        run: /usr/local/bin/terraform plan -input=false -out=tfplan
        working-directory: ./terraform/dev
        continue-on-error: true
        
      - name: Terraform Apply
        if: steps.plan.outcome == 'success'
        run: /usr/local/bin/terraform apply -auto-approve tfplan
        working-directory: ./terraform/dev

      - name: Get VM IP and Set as Output
        id: get-ip
        run: echo "new_vm_ip=$(/usr/local/bin/terraform output -raw new_vm_ip)" >> $GITHUB_OUTPUT
        working-directory: ./terraform/dev
        
      # - name: Wait for VM to boot and SSH to be ready
      #  run: sleep 150 
  
  configure-vm-dev:
    runs-on: self-hosted
    needs: [terraform-dev]
    if: always() && needs.terraform-dev.result == 'success'
    outputs:
      new_vm_ip: ${{ needs.terraform-dev.outputs.new_vm_ip }}
    environment:
      name: DEV
      url: http://${{ needs.terraform-dev.outputs.new_vm_ip }}:5000
      
    # Variáveis de Conexão do Ansible
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
      ANSIBLE_CONNECTION: "ssh"
      ANSIBLE_CONNECT_TIMEOUT: "30"
      ANSIBLE_TIMEOUT: "60"
      ANSIBLE_BECOME: "true"

    steps:
      - name: Checkout Repository (Para o Playbook Ansible e arquivos)
        uses: actions/checkout@v4

      - name: Remove chave SSH antiga do host (Corrige Host Key Changed)
        run: |
          VM_IP="${{ needs.terraform-dev.outputs.new_vm_ip }}"
          # O '|| true' garante que o pipeline não falhe se a chave não existir
          ssh-keygen -f /home/dev/.ssh/known_hosts -R "$VM_IP" || true
      
      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
          # Adicione a chave ao ssh-agent (melhor prática)
          eval "$(ssh-agent -s)"
          ssh-add /tmp/ansible_key
      
      - name: DEBUG - List files expected by Ansible
        run: |
          echo "Current directory is: $(pwd)"
          echo "Listing content of: files/"
          ls -la files/
          echo "Listing content of: ansible/"
          ls -la ansible/
        continue-on-error: true
      
      - name: Run Ansible Playbook to Setup Flask
        run: ansible-playbook -i ${{ needs.terraform-dev.outputs.new_vm_ip }}, ansible/playbook.yml --user ${{ env.ANSIBLE_USER }} --private-key /tmp/ansible_key -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
  
  update-haproxy-config-dev:
    runs-on: self-hosted
    needs: [configure-vm-dev]
    if: always() && needs.configure-vm-dev.result == 'success'
    environment:
      name: DEV

    env:
      HAPROXY_HOST: ${{ secrets.HAPROXY_SERVER_IP }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update HAProxy Config
        run: | 
          ansible-playbook -i $HAPROXY_HOST, ansible/haproxy/haproxy_config.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-dev.outputs.new_vm_ip }}" \
            -e "backend_name=app_servers_todo_dev" \
            -e "app_port=5000"

  update-prometheus-targets-dev:
    runs-on: self-hosted
    needs: [configure-vm-dev] 
    if: always() && needs.configure-vm-dev.result == 'success'
    environment:
      name: DEV

    env:
      PROMETHEUS_HOST: ${{ secrets.PROMETHEUS_SERVER_IP }}
      ANSIBLE_USER: "dev"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          # Reutiliza a chave SSH. Se o usuário for diferente, pode ser necessária outra chave.
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update Prometheus Targets
        run: | 
          ansible-playbook -i $PROMETHEUS_HOST, ansible/prometheus/prometheus_targets.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-dev.outputs.new_vm_ip }}" \
            -e "environment_name=dev" \
            -e "app_name=todo"
        
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
  
  update-grafana-dashboard-dev:
    runs-on: self-hosted
    needs: [configure-vm-dev, update-prometheus-targets-dev] 
    if: always() && needs.update-prometheus-targets-dev.result == 'success'
    environment:
      name: DEV
      
    env:
      GRAFANA_HOST: ${{ secrets.MONITORING_VM_IP }} 
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init (Grafana)
        run: terraform init
        working-directory: ./terraform/grafana/dev

      - name: Terraform Apply (Grafana Dashboard)
        run: | 
          terraform apply -auto-approve \
            -var "grafana_url=http://${{ env.GRAFANA_HOST }}:3000" \
            -var "grafana_api_key=${{ env.GRAFANA_API_KEY }}" \
            -var "environment=dev"
        working-directory: ./terraform/grafana/dev

#####################################################################
# JOB PARA PROVISIONAMENTO E CONFIGURAÇÃO DE QA
#####################################################################
  terraform-qa:
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'qa' && github.event.inputs.action_type == 'deploy')
    
    runs-on: self-hosted
    environment:
      name: QA
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init (QA)
        run: /usr/local/bin/terraform init
        working-directory: ./terraform/qa

      - name: Terraform Apply (QA)
        run: /usr/local/bin/terraform apply -auto-approve
        working-directory: ./terraform/qa

      - name: Get VM IP and Set as Output (QA)
        id: get-ip-qa
        run: echo "new_vm_ip_qa=$(/usr/local/bin/terraform output -raw new_vm_ip)" >> $GITHUB_OUTPUT
        working-directory: ./terraform/qa
        
      # - name: Wait for VM to boot and SSH to be ready
      #  run: sleep 120

    outputs:
      new_vm_ip_qa: ${{ steps.get-ip-qa.outputs.new_vm_ip_qa }}
      
  configure-vm-qa:
    runs-on: self-hosted
    needs: [terraform-qa]
    if: always() && needs.terraform-qa.result == 'success'
    outputs:
      new_vm_ip_qa: ${{ needs.terraform-qa.outputs.new_vm_ip_qa}}
    environment:
      name: QA
      url: http://${{ needs.terraform-qa.outputs.new_vm_ip_qa }}:5000
    
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
      ANSIBLE_CONNECTION: "ssh"
      ANSIBLE_CONNECT_TIMEOUT: "30"
      ANSIBLE_TIMEOUT: "60"
      ANSIBLE_BECOME: "true"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
            
      - name: Remove chave SSH antiga do host (Corrige Host Key Changed)
        run: |
          VM_IP="${{ needs.terraform-qa.outputs.new_vm_ip_qa }}"
          # O '|| true' garante que o pipeline não falhe se a chave não existir
          ssh-keygen -f /home/dev/.ssh/known_hosts -R "$VM_IP" || true

      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
          
      - name: Run Ansible Playbook to Setup Flask (QA)
        run: ansible-playbook -i ${{ needs.terraform-qa.outputs.new_vm_ip_qa }}, ansible/playbook-qa.yml --user ${{ env.ANSIBLE_USER }} --private-key /tmp/ansible_key

  update-haproxy-config-qa:
    runs-on: self-hosted
    needs: [configure-vm-qa]
    if: always() && needs.configure-vm-qa.result == 'success'
    environment:
      name: QA

    env:
      HAPROXY_HOST: ${{ secrets.HAPROXY_SERVER_IP }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update HAProxy Config
        run: | 
          ansible-playbook -i $HAPROXY_HOST, ansible/haproxy/haproxy_config.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-qa.outputs.new_vm_ip_qa }}" \
            -e "backend_name=app_servers_todo_qa" \
            -e "app_port=5000"

  update-prometheus-targets-qa:
    runs-on: self-hosted
    needs: [configure-vm-qa] 
    if: always() && needs.configure-vm-qa.result == 'success'
    environment:
      name: QA

    env:
      PROMETHEUS_HOST: ${{ secrets.PROMETHEUS_SERVER_IP }}
      ANSIBLE_USER: "dev"
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Prepare SSH Key for Ansible
        run: |
          # Reutiliza a chave SSH. Se o usuário for diferente, pode ser necessária outra chave.
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
        
      - name: Run Ansible Playbook to Update Prometheus Targets
        run: | 
          ansible-playbook -i $PROMETHEUS_HOST, ansible/prometheus/prometheus_targets.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "new_vm_ip=${{ needs.configure-vm-qa.outputs.new_vm_ip_qa }}" \
            -e "environment_name=qa" \
            -e "app_name=todo"
        
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  update-grafana-dashboard-qa:
    runs-on: self-hosted
    needs: [configure-vm-qa, update-prometheus-targets-qa] 
    if: always() && needs.update-prometheus-targets-qa.result == 'success'
    environment:
      name: QA
      
    env:
      GRAFANA_HOST: ${{ secrets.MONITORING_VM_IP }} 
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init (Grafana)
        run: terraform init
        working-directory: ./terraform/grafana/qa

      - name: Terraform Apply (Grafana Dashboard)
        run: | 
          terraform apply -auto-approve \
            -var "grafana_url=http://${{ env.GRAFANA_HOST }}:3000" \
            -var "grafana_api_key=${{ env.GRAFANA_API_KEY }}" \
            -var "environment=qa"
        working-directory: ./terraform/grafana/qa

#####################################################################
# JOB 1: BUILD & PUSH
#####################################################################
  build-and-push-image:
    name: Build & Push Docker Image to ECR
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'refs/heads/prod') || 
      (github.ref == 'refs/heads/prod' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod' && github.event.inputs.action_type == 'deploy')
    runs-on: ubuntu-latest
    
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      ECR_REPOSITORY: app-todo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: app-todo
          IMAGE_TAG: latest
        working-directory: ./files
        run: |
          echo "  Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          echo " Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo " Image pushed successfully!"
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
    outputs:
      image_tag: ${{ steps.image_info.outputs.IMAGE_TAG }}
      full_image_uri: ${{ steps.image_info.outputs.FULL_IMAGE_URI }}

# ============================================================
# TERRAFORM PROD - DEPLOY COM ZERO DOWNTIME
# ============================================================
  terraform-prod:
    needs: [build-and-push-image]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'refs/heads/prod') || 
      (github.ref == 'refs/heads/prod' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod' && github.event.inputs.action_type == 'deploy')
    runs-on: ubuntu-latest
    environment:
      name: PROD

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      APP_NAME: app-todo  
      ASG_NAME: app-todo-ec2-asg  

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init (PROD AWS)
        run: terraform init
        working-directory: ./terraform/prod

      - name: Terraform Plan (PROD AWS - PR/Dispatch)
        id: plan-prod
        run: terraform plan -input=false -out=tfplan
        working-directory: ./terraform/prod
        continue-on-error: true 

      #########################################################
      # DEPLOY COM ZERO DOWNTIME - INICIA AQUI
      #########################################################
      
      - name: Terraform Apply (detecta mudança no digest)
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        run: |
          echo " Aplicando Terraform..."
          echo "   - Terraform detectará mudança no digest da imagem ECR"
          echo "   - Launch Template será recriado"
          echo "   - Instance Refresh iniciará automaticamente"
          
          terraform apply -auto-approve
          
          echo " Terraform apply concluído!"
        working-directory: ./terraform/prod

      - name: Monitor Instance Refresh Progress
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        run: |
          echo " Monitorando Instance Refresh..."
          echo "   Isso pode levar 5-10 minutos..."
          
          # Tenta por até 20 iterações (10 minutos)
          for i in {1..20}; do
            echo ""
            echo " Verificação #$i ($(date +%H:%M:%S))"
            
            # Busca status do Instance Refresh
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --region ${{ env.AWS_DEFAULT_REGION }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text 2>/dev/null || echo "None")
            
            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --region ${{ env.AWS_DEFAULT_REGION }} \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text 2>/dev/null || echo "0")
            
            echo "    Status: $STATUS"
            echo "    Progresso: ${PERCENTAGE}%"
            
            # Verifica se completou com sucesso
            if [ "$STATUS" = "Successful" ]; then
              echo ""
              echo " Instance Refresh completado com sucesso!"
              break
            fi
            
            # Verifica se falhou
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo ""
              echo " Instance Refresh falhou ou foi cancelado!"
              echo "   Status final: $STATUS"
              exit 1
            fi
            
            # Se não há refresh ativo, pode ser porque não houve mudanças
            if [ "$STATUS" = "None" ] || [ "$STATUS" = "null" ]; then
              echo ""
              echo "  Nenhum Instance Refresh ativo."
              echo "   Isso pode significar que não houve mudanças detectadas."
              echo "   Continuando..."
              break
            fi
            
            # Aguarda 30s antes da próxima verificação
            sleep 30
          done

      - name: Verify Deployment
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        run: |
          echo " Verificando deployment final..."
          
          # Busca informações do ASG
          ASG_INFO=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.ASG_NAME }} \
            --region ${{ env.AWS_DEFAULT_REGION }} \
            --query 'AutoScalingGroups[0].[DesiredCapacity,MinSize,MaxSize]' \
            --output text)
          
          echo " Estado do ASG:"
          echo "   $ASG_INFO"
          
          # Conta instâncias saudáveis
          HEALTHY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.ASG_NAME }} \
            --region ${{ env.AWS_DEFAULT_REGION }} \
            --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy`] | length(@)' \
            --output text)
          
          echo "    Instâncias saudáveis: $HEALTHY"
          echo ""
          echo " DEPLOY PROD CONCLUÍDO COM SUCESSO!"
          echo "    Zero downtime"
          echo "    Instâncias atualizadas com nova versão"

#####################################################################
# JOB: DESTRUIR AMBIENTES / GRAFANA
#####################################################################

  # ============================================================
  # DESTROY DEV ENVIRONMENT
  # ============================================================
  destroy-dev:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev' && github.event.inputs.action_type == 'destroy'
    runs-on: self-hosted
    environment:
      name: DEV
    
    env:
      HAPROXY_HOST: ${{ secrets.HAPROXY_SERVER_IP }}
      PROMETHEUS_HOST: ${{ secrets.PROMETHEUS_SERVER_IP }}
      GRAFANA_HOST: ${{ secrets.MONITORING_VM_IP }}
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_USER: "dev"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # PASSO 1: Obter IP da VM antes de destruir
      - name: Get Current VM IP
        id: get-current-ip
        run: |
          cd ./terraform/dev
          /usr/local/bin/terraform init
          VM_IP=$(/usr/local/bin/terraform output -raw new_vm_ip 2>/dev/null || echo "")
          echo "current_vm_ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "VM IP a ser destruída: $VM_IP"
        continue-on-error: true

      # PASSO 2: Remover IP do HAProxy
      - name: Remove VM from HAProxy
        if: steps.get-current-ip.outputs.current_vm_ip != ''
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
          
          ansible-playbook -i $HAPROXY_HOST, ansible/haproxy/remove_backend.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "vm_ip=${{ steps.get-current-ip.outputs.current_vm_ip }}" \
            -e "backend=app_servers_todo_dev"
          
          echo "✅ IP ${{ steps.get-current-ip.outputs.current_vm_ip }} removido do HAProxy"
        continue-on-error: true

      # PASSO 3: Remover target do Prometheus
      - name: Remove VM from Prometheus Targets
        if: steps.get-current-ip.outputs.current_vm_ip != ''
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key
          
          ansible-playbook -i $PROMETHEUS_HOST, ansible/prometheus/remove_target.yml \
            --user ${{ env.ANSIBLE_USER }} \
            --private-key /tmp/ansible_key \
            -e "vm_ip=${{ steps.get-current-ip.outputs.current_vm_ip }}" \
            -e "environment=dev" \
            -e "app=todo"
          
          echo "✅ Target ${{ steps.get-current-ip.outputs.current_vm_ip }} removido do Prometheus"
        continue-on-error: true

      # PASSO 4: Destruir Dashboard do Grafana
      - name: Destroy Grafana Dashboard
        run: |
          cd ./terraform/grafana/dev
          /usr/local/bin/terraform init
          /usr/local/bin/terraform destroy -auto-approve \
            -var "grafana_url=http://${{ env.GRAFANA_HOST }}:3000" \
            -var "grafana_api_key=${{ env.GRAFANA_API_KEY }}" \
            -var "environment=dev"
          
          echo "✅ Dashboard do Grafana destruído"
        continue-on-error: true

      # PASSO 5: Destruir VM do VMware
      - name: Destroy VM from VMware
        run: |
