            -var "grafana_url=http://${{ env.GRAFANA_HOST }}:3000" \
            -var "grafana_api_key=${{ env.GRAFANA_API_KEY }}" \
            -var "environment=qa"
          
          echo "✅ Dashboard do Grafana destruído"
        continue-on-error: true

      # PASSO 5: Destruir VM do VMware
      - name: Destroy VM from VMware
        run: |
          cd ./terraform/qa
          /usr/local/bin/terraform init
          /usr/local/bin/terraform destroy -auto-approve
          
          echo "✅ VM do VMware destruída com sucesso"

